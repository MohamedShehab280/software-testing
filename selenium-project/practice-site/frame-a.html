<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Frame A</title><link rel="stylesheet" href="assets/site.css"></head>
<body class="frame-body"><h2 id="frame-heading">Frame A</h2><button type="button" id="frame-a-btn" class="btn btn-outline">Button in A</button><div class="result" id="frame-a-result"></div>
<script>
const show = (id, t) => { document.getElementById(id).textContent = t; };
document.getElementById('frame-a-btn').onclick = () => show('frame-a-result', 'Clicked in frame A');
</script></body></html>
