<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Frame C (nested)</title><link rel="stylesheet" href="assets/site.css"></head>
<body class="frame-body"><h2 id="frame-heading">Frame C (nested)</h2><button type="button" id="frame-c-btn" class="btn btn-outline">Button in C</button><div class="result" id="frame-c-result"></div>
<script>
const show = (id, t) => { document.getElementById(id).textContent = t; };
document.getElementById('frame-c-btn').onclick = () => show('frame-c-result', 'Clicked in frame C');
</script></body></html>
